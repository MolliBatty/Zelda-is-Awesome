<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore every Legend of Zelda game, save your favorites and write reviews.">
    <title>Zelda is Awesome</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/webp" href="images/triforce.webp">
    <script type="module" src="main.js"></script>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div id="wrapper">
        <header>
            <img class="triforce-icon" src="images/triforce.webp" alt="" width="56" height="56">
            <h1>Zelda is Awesome</h1>
        </header>

        <nav aria-label="Game menu">
            <div class="dropdown">
                <button class="dropbtn" id="dropbtn" type="button" aria-haspopup="true" aria-expanded="false"
                    aria-controls="dropdown-content">Jump to a Game ▾</button>
                <div class="dropdown-content" id="dropdown-content" hidden>
                    <!-- Links are generated from the API in dropdown.js -->
                </div>
            </div>
        </nav>

        <main id="main-content">
            <section class="game-info" aria-labelledby="featured-heading">
                <h2 id="featured-heading">Featured Game</h2>
                <div id="featured-body" aria-live="polite">
                    <p class="status">Loading…</p>
                </div>
            </section>

            <section class="browse" aria-labelledby="browse-heading">
                <h2 id="browse-heading">Browse All Games</h2>

                <form id="filters" class="filters" role="search" aria-label="Filter games">
                    <div class="field">
                        <label for="search">Search games</label>
                        <input id="search" name="q" type="search" placeholder="Try &quot;Ocarina&quot; or &quot;Link&quot;"
                            autocomplete="off">
                    </div>
                    <div class="field field-check">
                        <input id="fav-only" name="fav" type="checkbox">
                        <label for="fav-only">Favorites only</label>
                    </div>
                </form>

                <p id="result-count" class="meta" role="status"></p>
                <div id="game-grid" class="game-grid"></div>
            </section>
        </main>

        <footer>
            <p>Data from the <a href="https://zelda.fanapis.com/" target="_blank" rel="noopener">Zelda Fan API</a>.
                A fan project, not affiliated with Nintendo.</p>
        </footer>
    </div>
</body>

</html>
